<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Library | Rock Church Music</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="site-header">
        <div class="header-left">
            <a href="../index.html" class="logo-link">
                <img src="../images/RockLogo.png" class="logo" alt="Rock Church Logo">
            </a>

            <div class="header-text">
                <p>Rock Church Music</p>
            </div>
        </div>

        <nav class="top-nav">
            <a href="../index.html" class="nav-link">Home</a>
            <a href="./whoarewe.html" class="nav-link">Who Are We?</a>
            <a href="./whatwebelieve.html" class="nav-link">What We Believe</a>
            <a href="./pastsermons.html" class="nav-link">Past Sermons</a>
            <a href="./calendar.html" class="nav-link">Calendar</a>
            <a href="./donate.html" class="nav-link">Donate</a>
            <a href="./more.html" class="nav-link">More</a>
            <a href="./rockmusic.html" class="nav-link active">Music & Livestreams</a>
        </nav>
    </div>

    <main class="song-library-main">

        <section class="song-library-hero">
            <p class="section-kicker">Song Library</p>
            <h1>Worship Song Library</h1>
            <p>
                Browse songs used by the worship team. Click a song to load the video and listen.
            </p>
        </section>

        <section class="song-library-layout">

            <div class="song-player-card">
                <h2 id="activeSongTitle"></h2>
                <p id="activeSongArtist" class="song-player-meta"></p>

                <div class="song-youtube-wrap" id="playerWrap">
                    <div class="song-placeholder" id="songPlaceholder">
                        Select a song to play
                    </div>

                    <iframe
                        id="songPlayer"
                        src=""
                        title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="song-scroll-card">
                <h2>All Songs</h2>

                <input
                    type="text"
                    id="songSearch"
                    class="song-search"
                    placeholder="Search songs..."
                >

                <div class="song-scroll-list" id="songList">
                    <p>Loading songs...</p>
                </div>
            </div>

        </section>

    </main>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeVrWExyazLI1ZRrHR35wAvmCQ1uEKj1dyRneeylYnZ7Yg2DyxzVGgLp_xdomZ00_6pMMCcZG7zip/pub?gid=0&single=true&output=csv";

        const player = document.getElementById("songPlayer");
        const title = document.getElementById("activeSongTitle");
        const artist = document.getElementById("activeSongArtist");
        const search = document.getElementById("songSearch");
        const songList = document.getElementById("songList");
        const placeholder = document.getElementById("songPlaceholder");

        let songs = [];

        function parseCSV(text) {
            const rows = text.trim().split(/\r?\n/).map(row => row.split(","));
            const headers = rows.shift().map(h => h.trim());

            return rows.map(row => {
                const item = {};
                headers.forEach((header, index) => {
                    item[header] = row[index] ? row[index].trim() : "";
                });
                return item;
            });
        }

        function renderSongs(list) {
            songList.innerHTML = "";

            const visibleSongs = list.filter(song =>
                song.active && song.active.toLowerCase() !== "no"
            );

            if (visibleSongs.length === 0) {
                songList.innerHTML = "<p>No songs found.</p>";
                return;
            }

            visibleSongs.forEach(song => {
                const button = document.createElement("button");
                button.className = "library-song";

                button.innerHTML = `
                    <span>${song.title}</span>
                    <small>${song.artist}</small>
                `;

                button.addEventListener("click", () => {
                    document.querySelectorAll(".library-song").forEach(s => s.classList.remove("active"));
                    button.classList.add("active");

                    title.textContent = song.title;
                    artist.textContent = song.artist;

                    player.src = `https://www.youtube.com/embed/${song.youtubeId}?autoplay=1`;

                    placeholder.style.display = "none";
                    player.style.opacity = "1";
                });

                songList.appendChild(button);
            });
        }

        fetch(SHEET_URL)
            .then(response => response.text())
            .then(text => {
                songs = parseCSV(text);
                renderSongs(songs);
            })
            .catch(error => {
                songList.innerHTML = "<p>Could not load songs.</p>";
                console.error(error);
            });

        search.addEventListener("input", () => {
            const searchText = search.value.toLowerCase();

            const filtered = songs.filter(song =>
                song.title.toLowerCase().includes(searchText) ||
                song.artist.toLowerCase().includes(searchText)
            );

            renderSongs(filtered);
        });
    </script>
</body>
</html>
