<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.67">
    <!-- Keeps this page out of Google's search results even though it's not linked in the nav -->
    <meta name="robots" content="noindex, nofollow">
    <title>Musician Resources | The Rock Church</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        /* ---------- Compact musician-resource layout ---------- */

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .msc-main {
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            padding: 6px 11px 7px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .msc-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .msc-topbar a {
            color: #e0d4ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.67rem;
        }

        .msc-topbar a:hover {
            text-decoration: underline;
        }

        .msc-hero {
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 6px;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 21px rgba(0, 0, 0, 0.35);
        }

        .msc-hero h1 {
            margin: 0 0 1px;
            font-size: 0.84rem;
        }

        .msc-hero p {
            margin: 0;
            color: #efefef;
            line-height: 1.2;
            font-size: 0.55rem;
        }

        .msc-layout {
            display: grid;
            grid-template-columns: 700px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr);
            gap: 7px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }

        .msc-left {
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-height: 0;
        }

        .msc-list-card {
            background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 7px;
            flex: 3 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 21px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
        }

        .msc-list-card h2 {
            margin-top: 0;
            margin-bottom: 1px;
            font-size: 0.735rem;
        }

        .msc-search {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 7px;
            margin: 4px 0 6px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.10);
            color: white;
            font-size: 0.665rem;
            outline: none;
        }

        .msc-search::placeholder {
            color: #cfcfcf;
        }

        .msc-song-list {
            flex: 1;
            min-height: 56px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 3px;
        }

        .msc-song {
            width: 100%;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border-radius: 7px;
            padding: 6px 7px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .msc-song:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .msc-song.active {
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
        }

        .msc-song .song-name {
            font-weight: 700;
            font-size: 0.686rem;
        }

        .msc-song .song-sub {
            font-size: 0.595rem;
            color: #d8d8d8;
        }

        .msc-chart-card {
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 7px;
            min-height: 0;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 21px rgba(0, 0, 0, 0.35);
        }

        .msc-video-card {
            background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            padding: 6px;
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 21px rgba(0, 0, 0, 0.35);
            flex: 2 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .msc-video-card h3 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 0.7rem;
            color: #dcdcdc;
            flex-shrink: 0;
        }

        .msc-video-wrap {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 7px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }

        .msc-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }

        .msc-chart-header h2 {
            margin: 0 0 3px;
            font-size: 0.735rem;
        }

        .msc-chart-header .song-sub {
            color: #d6d6d6;
            font-size: 0.665rem;
        }

        .msc-open-btn {
            font-size: 0.595rem;
            padding: 5px 8px;
        }

        .msc-chart-frame-wrap {
            position: relative;
            width: 100%;
            min-height: 0;
            height: 100%;
            flex: 1;
            border-radius: 7px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.95);
        }

        .msc-chart-frame-wrap iframe {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: none;
            display: block;
        }

        .msc-chart-frame-wrap img {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: none;
            display: block;
            object-fit: contain;
        }

        .msc-chart-placeholder {
            min-height: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #cfcfcf;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 11px;
        }

        .msc-video-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 200px) {
            html, body { overflow: auto; }

            .msc-main { flex: none; overflow: visible; }

            .msc-layout {
                grid-template-columns: 1fr;
                grid-template-rows: none;
            }

            .msc-list-card,
            .msc-video-card {
                flex: none;
            }

            .msc-video-wrap {
                min-height: 140px;
            }

            .msc-song-list {
                max-height: 224px;
            }

            .msc-chart-frame-wrap,
            .msc-chart-frame-wrap iframe,
            .msc-chart-frame-wrap img,
            .msc-chart-placeholder {
                min-height: 420px;
            }
        }

        @media (min-width: 1001px) {
            body { overflow: hidden; }
        }

        #musicianContent {
    zoom: 0.70;
    width: 95.25%;
    height: 149.25%;
}
    </style>
</head>
<body>

    <div id="musicianContent">

        <div class="site-header">
            <div class="header-left">
                <a href="../index.html" class="logo-link">
                    <img src="../images/RockLogo.png" class="logo" alt="Rock Church Logo">
                </a>
                <div class="header-text">
                    <p>The Rock Church — Musician Resources</p>
                </div>
            </div>
        </div>

        <main class="msc-main">

            <div class="msc-topbar">
                <a href="../index.html">&larr; Back to main site</a>
            </div>

            <section class="msc-hero">
                <h1>Learn This Week's Music</h1>
            </section>

            <section class="msc-layout">

                <div class="msc-left">

                    <div class="msc-list-card">
                        <h2>Songs</h2>
                        <input type="text" id="mscSearch" class="msc-search" placeholder="Search songs...">

                        <div class="msc-song-list" id="mscSongList">
                            <p>Loading songs...</p>
                        </div>
                    </div>

                    <div class="msc-video-card">
                        <h3>Reference Video</h3>
                        <div class="msc-video-wrap">
                            <iframe id="mscVideoPlayer" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>

                </div>

                <div class="msc-chart-card">
                    <div class="msc-chart-header">
                        <div>
                            <h2 id="mscChartTitle">Select a song</h2>
                            <p class="song-sub" id="mscChartMeta"></p>
                        </div>
                        <a id="mscOpenChart" class="library-button msc-open-btn" href="#" target="_blank" style="display:none;">
                            Open Full Size
                        </a>
                    </div>

                    <div id="mscChartFrameWrap" class="msc-chart-frame-wrap">
                        <div class="msc-chart-placeholder">
                            Choose a song on the left to view its lyrics &amp; chords here.
                        </div>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <script>
        // The header may be a normal in-flow element or a fixed/sticky bar
        // from the site-wide stylesheet — we can't know which from here, so
        // measure it for real instead of guessing a height in CSS.
        (function () {
            var header = document.querySelector('.site-header');
            var main = document.querySelector('.msc-main');
            if (!header || !main) return;

            function fit() {
                if (window.innerWidth <= 1000) {
                    // Mobile layout stacks and scrolls on purpose — undo any inline sizing.
                    main.style.height = '';
                    main.style.marginTop = '';
                    return;
                }

                var headerHeight = header.offsetHeight;
                var position = window.getComputedStyle(header).position;
                var outOfFlow = (position === 'fixed' || position === 'absolute');

                // If the header is taken out of normal flow, main would otherwise
                // start at the very top of the page and get covered by it.
                main.style.marginTop = outOfFlow ? headerHeight + 'px' : '0px';
                const zoom = parseFloat(
    getComputedStyle(document.getElementById('musicianContent')).zoom
) || 1;

main.style.height =
    ((window.innerHeight / zoom) - header.offsetHeight) + 'px';
            }

            fit();
            window.addEventListener('resize', fit);
            window.addEventListener('load', fit);
            // Logo/webfonts can shift the header's height slightly after first paint.
            setTimeout(fit, 300);
        })();
    </script>

    <script>
        /* =========================================================
           SONG DATA
           Same pattern as songlibrary.html / rockmusic.html: a Google
           Sheet published to the web as CSV.

           TODO: Replace SHEET_URL below with your real published CSV link.
           File > Share > Publish to web > pick the tab > CSV.

           Your sheet needs these column headers (any capitalization is fine):
             title      - song title
             artist     - artist/writer
             key        - the key you play it in (optional)
             youtubeId  - YouTube video ID for the reference video
             chartUrl   - link to the chord chart (PDF, Google Doc,
                          Google Drive file, or image). Works with:
                            - a Google Drive "share" link
                            - a direct link to a .pdf, .jpg, or .png
                            - a Google Docs "share" link
             active     - "no" to hide a song, blank/anything else to show it
        ========================================================= */

        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRoeVrWExyazLI1ZRrHR35wAvmCQ1uEKj1dyRneeylYnZ7Yg2DyxzVGgLp_xdomZ00_6pMMCcZG7zip/pub?gid=0&single=true&output=csv";

        let allSongs = [];

        const songListEl = document.getElementById("mscSongList");
        const searchEl = document.getElementById("mscSearch");
        const chartTitleEl = document.getElementById("mscChartTitle");
        const chartMetaEl = document.getElementById("mscChartMeta");
        const chartFrameWrap = document.getElementById("mscChartFrameWrap");
        const openChartLink = document.getElementById("mscOpenChart");
        const videoPlayer = document.getElementById("mscVideoPlayer");

        // Splits one CSV line on commas, but ignores commas that are inside
        // "quoted fields" (Google Sheets quotes any value containing a comma).
        function splitCSVLine(line) {
            const result = [];
            let current = "";
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    result.push(current);
                    current = "";
                } else {
                    current += char;
                }
            }

            result.push(current);
            return result;
        }

        function parseCSV(text) {
            const rows = text.trim().split(/\r?\n/).map(splitCSVLine);

            // Lowercased so "chartUrl", "ChartUrl", "CHARTURL" all match the same field.
            const headers = rows.shift().map(h => h.trim().toLowerCase());

            return rows.map(row => {
                const item = {};
                headers.forEach((header, index) => {
                    item[header] = row[index] ? row[index].trim() : "";
                });
                return item;
            });
        }

        // Turns a Google Drive/Docs share link into an embeddable preview link.
        // Leaves direct file links (pdf/jpg/png) and anything else alone.
        function toEmbeddableChartUrl(url) {
            if (!url) return { type: "none", url: "" };

            const lower = url.toLowerCase();

            if (lower.endsWith(".pdf")) {
                return { type: "pdf", url: `${url}#toolbar=0&view=FitH` };
            }
            if (lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png")) {
                return { type: "image", url };
            }

            // Google Drive file link: .../file/d/FILE_ID/view -> /preview
            // This is Google's own current, supported embed format. Direct
            // hotlinks (uc?export=view/download) are blocked by Google now
            // (CORS + their 2024 third-party-cookie changes), which is why
            // that approach failed to load. /preview still works.
            const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
            if (driveMatch) {
                return { type: "pdf", url: `https://drive.google.com/file/d/${driveMatch[1]}/preview` };
            }

            // Google Docs link: switch to /preview
            if (lower.includes("docs.google.com")) {
                const cleanUrl = url.split("?")[0].replace(/\/edit$/, "");
                return { type: "pdf", url: `${cleanUrl}/preview` };
            }

            // Fallback: just try to embed whatever was given
            return { type: "pdf", url };
        }

        function renderChart(song) {
            chartTitleEl.textContent = song.title;
            chartMetaEl.textContent = [song.artist, song.key ? `Key of ${song.key}` : ""]
                .filter(Boolean).join(" • ");

            const chart = toEmbeddableChartUrl(song.charturl);

            if (chart.type === "none") {
                chartFrameWrap.innerHTML = `<div class="msc-chart-placeholder">No chord chart linked for this song yet.</div>`;
                openChartLink.style.display = "none";
                return;
            }

            if (chart.type === "image") {
                chartFrameWrap.innerHTML = `<img src="${chart.url}" alt="${song.title} chord chart">`;
            } else {
                chartFrameWrap.innerHTML = `<iframe src="${chart.url}"></iframe>`;
            }

            openChartLink.href = song.charturl;
            openChartLink.style.display = "inline-block";
        }

        function playVideo(song) {
            if (song.youtubeid) {
                videoPlayer.src = `https://www.youtube.com/embed/${song.youtubeid}`;
            } else {
                videoPlayer.src = "";
            }
        }

        function renderSongList(songs) {
            songListEl.innerHTML = "";

            const visible = songs.filter(song => song.active && song.active.toLowerCase() !== "no");

            if (visible.length === 0) {
                songListEl.innerHTML = "<p>No songs found.</p>";
                return;
            }

            visible.forEach(song => {
                const btn = document.createElement("button");
                btn.className = "msc-song";
                btn.innerHTML = `
                    <span class="song-name">${song.title}</span>
                    <span class="song-sub">${song.artist}</span>
                `;

                btn.addEventListener("click", () => {
                    document.querySelectorAll(".msc-song").forEach(s => s.classList.remove("active"));
                    btn.classList.add("active");
                    renderChart(song);
                    playVideo(song);
                });

                songListEl.appendChild(btn);
            });
        }

        function loadSongs() {
            if (!SHEET_URL || SHEET_URL.indexOf("PASTE_YOUR") === 0) {
                songListEl.innerHTML = "<p>No song sheet connected yet.</p>";
                return;
            }

            // Cache-busting param so browsers/CDNs don't serve a stale copy of the sheet.
            const fetchUrl = SHEET_URL + (SHEET_URL.includes("?") ? "&" : "?") + "_=" + Date.now();

            fetch(fetchUrl)
                .then(res => res.text())
                .then(text => {
                    allSongs = parseCSV(text);
                    console.log("Loaded songs from sheet:", allSongs);
                    renderSongList(allSongs);
                })
                .catch(err => {
                    console.error("Could not load the song sheet:", err);
                    songListEl.innerHTML = "<p>Could not load songs. Check the SHEET_URL and try again.</p>";
                });
        }

        searchEl.addEventListener("input", () => {
            const q = searchEl.value.toLowerCase();
            const filtered = allSongs.filter(song =>
                song.title.toLowerCase().includes(q) ||
                song.artist.toLowerCase().includes(q)
            );
            renderSongList(filtered);
        });

        loadSongs();
    </script>

</body>
</html>
